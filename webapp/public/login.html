<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden login</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<script>
  (function () {
    let t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/ui.css">
<style>
  body { display: grid; place-items: center; padding: 24px 16px; }
  .wrap { width: 100%; max-width: 384px; display: grid; gap: 24px; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px; }
  .brand .icon { width: 20px; height: 20px; }
  form { display: grid; gap: 24px; }
  .field { display: grid; gap: 12px; }
  #theme { position: fixed; top: 12px; right: 12px; }
  #err { margin: 0; color: var(--destructive); font-size: 14px; }
  #err:empty { display: none; }
</style>
</head>
<body>
<button id="theme" class="btn btn-ghost btn-icon" aria-label="Toggle theme" title="Toggle theme">
  <svg class="icon i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  <svg class="icon i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
</button>

<div class="wrap">
  <div class="brand">
    <svg class="icon" viewBox="0 0 24 24"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></svg>
    Garden
  </div>

  <div class="card">
    <div class="card-header" style="grid-template-columns:1fr">
      <h1 class="card-title">Log in to your dashboard</h1>
      <p class="card-description">Enter your username and password below.</p>
    </div>
    <div class="card-content">
      <form id="f">
        <div class="field">
          <label class="label" for="username">Username</label>
          <input class="input" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label class="label" for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="field" style="gap:8px">
          <button class="btn btn-block" id="submit">Log in</button>
          <p id="err" role="alert"></p>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
document.getElementById('theme').onclick = () => {
  const dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
};
const f = document.getElementById('f'), err = document.getElementById('err'), btn = document.getElementById('submit');
f.onsubmit = async e => {
  e.preventDefault();
  err.textContent = '';
  btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    const r = await fetch('/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: f.username.value, password: f.password.value }),
    });
    if (r.ok) return location.replace('/');
    err.textContent = (await r.json().catch(() => ({}))).error || `Error ${r.status}`;
  } catch { err.textContent = 'Network error'; }
  btn.disabled = false; btn.textContent = 'Log in';
};
</script>
</body>
</html>
