<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden login</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<style>
  :root { --bg: #f4f6f3; --card: #fff; --text: #1d2b1f; --muted: #6b776d; --line: #e2e7e1; --accent: #2f8f4e; --bad: #a3271b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121613; --card: #1b211c; --text: #e4ebe5; --muted: #95a197; --line: #2c342d; --accent: #4cbb6d; --bad: #ff8a7a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  form { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 12px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  label { display: grid; gap: 4px; color: var(--muted); font-size: .9rem; }
  input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); min-height: 44px; }
  button { font: inherit; font-weight: 600; min-height: 44px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  #err { min-height: 1.4em; color: var(--bad); font-size: .9rem; margin: 0; }
</style>
</head>
<body>
<form id="f">
  <h1>🌱 Garden</h1>
  <label>Username <input name="username" autocomplete="username" required autofocus></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button>Log in</button>
  <p id="err" role="alert"></p>
</form>
<script>
const f = document.getElementById('f'), err = document.getElementById('err');
f.onsubmit = async e => {
  e.preventDefault();
  err.textContent = '';
  f.querySelector('button').disabled = true;
  try {
    const r = await fetch('/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: f.username.value, password: f.password.value }),
    });
    if (r.ok) return location.replace('/');
    err.textContent = (await r.json().catch(() => ({}))).error || `Error ${r.status}`;
  } catch { err.textContent = 'Network error'; }
  f.querySelector('button').disabled = false;
};
</script>
</body>
</html>
