# /etc/nginx/sites-available/garden  ->  symlink into sites-enabled
server {
    listen 80;
    listen [::]:80;
    server_name garden.britod.my.id;
    return 301 https://$host$request_uri;
}

server {
    # "listen ... http2" works on Ubuntu 24.04's nginx 1.24 ("http2 on;" needs 1.25.1+).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name garden.britod.my.id;

    # Cloudflare Origin Certificate (SSL/TLS > Origin Server). Cloudflare mode: Full (strict).
    ssl_certificate     /etc/ssl/cloudflare/garden.pem;
    ssl_certificate_key /etc/ssl/cloudflare/garden.key;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # Server-Sent Events: no buffering, long-lived connection.
    location = /events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
